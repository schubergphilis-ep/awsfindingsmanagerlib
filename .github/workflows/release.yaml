name: Release Orchestration

on:
  push:
    branches:
      - main

jobs:
  release:
    name: Release Please
    runs-on: ubuntu-latest
    outputs:
      releases_created: ${{ steps.release-please.outputs.releases_created }}
      tag_name: ${{ steps.release-please.outputs.tag_name }}
    permissions:
      contents: write
      pull-requests: write
    steps:
      - id: release-please
        name: Release Please
        uses: googleapis/release-please-action@16a9c90856f42705d54a6fda1823352bdc62cf38 # v4.4.0
        with:
          # advanced configuration is needed as long as this issue is open:
          # https://github.com/googleapis/release-please/issues/2561
          # both below are the defaults, but good to make the relation explicit
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    needs: release
    if: ${{ needs.release.outputs.releases_created == 'true' }}
    name: Publish to PyPI
    runs-on: ubuntu-latest
    environment:
      name: pypi
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Setup environment
        uses: ./.github/actions/setup-env
        with:
          enable-uv-cache: false # No caching to ensure correct dependencies for publishing
          sync-uv: false

      - name: Build package
        run: uv build

      - name: Publish package
        run: uv publish

  publish-docs:
    needs: release
    if: ${{ needs.release.outputs.releases_created == 'true' }}
    name: Publish to GitHub Pages
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Setup environment
        uses: ./.github/actions/setup-env
        with:
          enable-uv-cache: false # No caching to ensure correct dependencies for publishing
          sync-uv: true

      - name: Build docs
        run: uv run mkdocs build

      - name: Setup GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: ./site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5

  publish-lambda:
    needs: release
    if: ${{ needs.release.outputs.releases_created == 'true' }}
    name: Publish lambda
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Setup environment
        uses: ./.github/actions/setup-env
        with:
          enable-uv-cache: false # No caching to ensure correct dependencies for publishing
          sync-uv: false

      - name: Define requirements for lambda package
        run: |
          uv export \
            --frozen \
            --all-extras \
            --no-dev \
            --no-editable \
            -o requirements.txt

      - name: Pip install dependencies for lambda
        run: |
          uv pip install \
            --no-installer-metadata \
            --no-compile-bytecode \
            --python-platform x86_64-manylinux2014 \
            --python 3.12 \
            --target lambda_package \
            -r requirements.txt

      - name: Smoke-test the lambda package
        env:
          PYTHONPATH: lambda_package
          AWS_DEFAULT_REGION: eu-west-1
        run: |
          python3 -c "
          import awsfindingsmanagerlib.aws_lambda.events
          import awsfindingsmanagerlib.aws_lambda.trigger
          import awsfindingsmanagerlib.aws_lambda.worker
          import awsfindingsmanagerlib.aws_lambda.scheduled
          print('lambda_package imports cleanly')
          "

      - name: Package lambda code
        run: |
          cd lambda_package
          zip -rq ../lambda_package.zip .

      - name: Upload lambda_package.zip to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          TAG_NAME="${{ needs.release.outputs.tag_name }}"
          gh release upload "$TAG_NAME" lambda_package.zip --clobber --repo "$GITHUB_REPOSITORY"
